name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crea i file del progetto
        run: |
          mkdir -p app app/src/main app/src/main/java/app/tvcleaner app/src/main/res/drawable app/src/main/res/values app/src/main/res/xml
          cat > app/build.gradle.kts <<'TVC_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "app.tvcleaner"
              compileSdk = 34

              defaultConfig {
                  applicationId = "app.tvcleaner"
                  minSdk = 24
                  targetSdk = 28
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }
          }
